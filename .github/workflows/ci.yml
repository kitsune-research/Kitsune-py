name: Kitsune NIDS Core CI

on:
  push:
    branches: [ main, master, chore/uv-migration ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-engine:
    name: Test & Audit (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Astral uv & Setup Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev build-essential

      - name: Install System Dependencies (Windows Npcap SDK)
        if: runner.os == 'Windows'
        run: |
          choco install npcap --version=1.79.0 || true

      - name: Sync Deterministic Environment (uv.lock)
        run: uv sync --locked

      - name: Execute Deterministic Pytest Suite
        run: uv run pytest -v --cov=KitNET tests/
