name: Kitsune NIDS Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-engine:
    name: Test & Audit (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev build-essential

      - name: Install System Dependencies (Windows Npcap SDK)
        if: runner.os == 'Windows'
        run: |
          # En Windows GitHub Actions utiliza WinPcap/Npcap stub para enlaces de Scapy
          choco install npcap --version=1.79.0 || true

      - name: Upgrade Toolchain & Install Package
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython
          pip install -e .
          pip install pytest pytest-cov

      - name: Execute Deterministic Pytest Suite
        run: |
          pytest -v --cov=KitNET tests/
