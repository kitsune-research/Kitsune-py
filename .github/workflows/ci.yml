name: Kitsune CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install build toolchain and package in editable mode
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-input Cython
          pip install --no-input -e .
          pip install --no-input pytest pytest-cov

      - name: Add Python Scripts directory to PATH
        shell: bash
        run: |
          SCRIPTS_PATH=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$SCRIPTS_PATH" >> $GITHUB_PATH

      - name: Verify CLI Entry Points and Engine Health
        run: |
          python -c "import kitsune; print(f'Kitsune engine imported successfully (v{getattr(kitsune, \"__version__\", \"0.4.0\")})')"
          kitsune --help
          kitsune demo --help
          kitsune eval --help

      - name: Run deterministic test suite (18 Invariants)
        run: |
          pytest tests/ -v --tb=short --cov=kitsune --cov-report=term-missing