name: Kitsune CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancela ejecuciones redundantes en la misma rama ante commits sucesivos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # Previene procesos zombi en sockets o streams

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install build toolchain and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-input Cython
          pip install --no-input -e .
          pip install --no-input pytest pytest-cov

      - name: Run deterministic test suite
        run: |
          pytest tests/ -v --cov=KitNET --cov=AfterImage --cov-report=term-missing