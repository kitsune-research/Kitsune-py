[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune-nids"
version = "0.2.0"
description = "Modern, reproducible Python implementation of Kitsune NIDS for network anomaly research"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "kitsune-research" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scapy>=2.5.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
kitsune = "cli:main"

[tool.setuptools]
py-modules = ["cli", "Kitsune", "AfterImage", "FeatureExtractor", "netStat"]
packages = ["KitNET"]